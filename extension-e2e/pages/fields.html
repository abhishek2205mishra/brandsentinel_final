<!doctype html><html lang="en"><head><meta charset="utf-8"><title>Plain fields and a webmail-style composer</title></head>
<body style="font-family:system-ui;max-width:760px;margin:30px auto"><h1>Social composer and webmail-style compose box</h1>
<label>Post <textarea id="post" rows="6" style="width:100%"></textarea></label>
<p><label>Email address <input id="title" type="text" placeholder="Subject"></label></p>
<p><label>Password <input id="pw" type="password"></label></p>
<p><label>Card number <input id="cc" type="text" name="card" autocomplete="cc-number"></label></p>
<div id="gmail" role="textbox" aria-label="Message Body" contenteditable="true" style="border:1px solid #999;min-height:140px;padding:8px"></div>
</body></html>
